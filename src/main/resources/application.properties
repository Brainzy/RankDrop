# Server
server.port=8080
# PostgreSQL datasource - H2 removed
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:rankdrop}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USERNAME:rankdrop}
spring.datasource.password=${DB_PASSWORD:rankdrop}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP connection pool
spring.datasource.hikari.pool-name=RankDropHikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# JPA / Hibernate - validate disabled, Flyway owns schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Flyway - disabled, managed manually in FlywayConfig.java
spring.flyway.enabled=false
# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Logging
logging.level.root=INFO
logging.level.io.github.brainzy=DEBUG
logging.level.org.flywaydb=DEBUG
# Gzip compression
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=64
server.forward-headers-strategy=framework
# Swagger / SpringDoc
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.url=/v3/api-docs
springdoc.server-url=https://ambitious-ilka-nenadnikolictf-02574966.koyeb.app/